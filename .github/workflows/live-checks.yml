name: live-checks

# Weekly checks that depend on the outside world. Kept out of test.yml so a slow
# government API or the passing of time never blocks a pull request.
# A failed scheduled run emails the repository owner.

on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

jobs:
  records-apis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Public records APIs still answer with the fields the scripts read
        run: python tools/records_smoke.py
