name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Skill format and writing rules
        run: python tools/check_skills.py
      - name: Unit tests
        run: python -m unittest discover tests -v

  # macOS ships Python 3.9 as /usr/bin/python3. setup-python has no 3.9 build for the
  # current runner image, so this job runs in the official Python image instead.
  test-39:
    runs-on: ubuntu-latest
    container: python:3.9-slim
    steps:
      - uses: actions/checkout@v4
      - name: Skill format and writing rules
        run: python tools/check_skills.py
      - name: Unit tests
        run: python -m unittest discover tests -v
